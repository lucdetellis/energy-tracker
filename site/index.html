<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <title>Energy Tracker</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
      tailwind.config = {
        darkMode: 'media',
        theme: {
          extend: {
            colors: {
              accent: { DEFAULT: '#2bb98a', ink: '#1e9e74' },
              level: { high: '#2bb98a', avg: '#f5b83d', low: '#ff5a5f' },
            },
          },
        },
      };
    </script>
    <script defer type="module" src="./app.js"></script>
  </head>
  <body class="min-h-screen bg-neutral-100 font-sans text-neutral-900 antialiased dark:bg-neutral-950 dark:text-neutral-100">
    <div class="mx-auto max-w-xl px-4 pb-[max(2rem,env(safe-area-inset-bottom))] pt-[max(1rem,env(safe-area-inset-top))]">
      <header class="flex items-baseline justify-between py-3">
        <h1 class="text-xl font-semibold tracking-tight text-accent-ink dark:text-accent">Energy Tracker</h1>
        <p id="sync-status" class="flex items-center gap-1.5 text-xs text-neutral-500 dark:text-neutral-400" role="status" aria-live="polite">Loading…</p>
      </header>

      <main class="space-y-3">
        <p id="load-error" class="rounded-md border-l-4 border-accent bg-white p-3 text-sm shadow-sm dark:bg-neutral-900" role="alert" hidden></p>

        <section class="rounded-md border border-neutral-200 bg-white p-4 shadow-sm dark:border-neutral-800 dark:bg-neutral-900" aria-labelledby="today-title">
          <div class="mb-3 flex items-center justify-between">
            <h2 id="today-title" class="text-base font-semibold">Today <span id="today-date" class="ml-1 text-sm font-normal text-neutral-500 dark:text-neutral-400"></span></h2>
            <span id="today-average"></span>
          </div>
          <div id="today-blocks" class="grid grid-cols-[repeat(15,minmax(0,1fr))] gap-[3px]" role="group" aria-label="Today's hourly energy"></div>
          <div id="today-flags" class="mt-[3px] grid grid-cols-[repeat(15,minmax(0,1fr))] gap-[3px]" aria-hidden="true" hidden></div>
          <div class="hour-axis mt-1.5 grid grid-cols-[repeat(15,minmax(0,1fr))] gap-[3px] text-[10px] text-neutral-500 dark:text-neutral-400" aria-hidden="true"></div>
          <p id="today-detail" class="mt-3 min-h-5 text-sm text-neutral-600 dark:text-neutral-300" aria-live="polite"></p>
        </section>

        <section class="rounded-md border border-neutral-200 bg-white p-4 shadow-sm dark:border-neutral-800 dark:bg-neutral-900" aria-labelledby="history-title">
          <div class="mb-3 flex items-center justify-between">
            <h2 id="history-title" class="text-base font-semibold">Previous days</h2>
            <span class="text-[10px] uppercase tracking-wide text-neutral-500 dark:text-neutral-400">Avg</span>
          </div>
          <div class="grid grid-cols-[1fr_3rem] gap-2" aria-hidden="true">
            <div class="hour-axis grid grid-cols-[repeat(15,minmax(0,1fr))] gap-[2px] text-[10px] text-neutral-500 dark:text-neutral-400"></div>
          </div>
          <ol id="history" class="mt-1 divide-y divide-neutral-100 dark:divide-neutral-800"></ol>
          <button id="show-more" type="button" class="mt-3 w-full rounded-sm border border-neutral-200 py-2.5 text-sm font-medium text-accent-ink transition-colors hover:bg-accent/10 dark:text-accent focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent dark:border-neutral-800">Show 14 more days</button>
        </section>

        <section class="rounded-md border border-neutral-200 bg-white p-4 shadow-sm dark:border-neutral-800 dark:bg-neutral-900" aria-labelledby="trend-title">
          <div class="mb-2 flex items-baseline justify-between">
            <h2 id="trend-title" class="text-base font-semibold">Daily average</h2>
            <span id="trend-range" class="text-xs text-neutral-500 dark:text-neutral-400"></span>
          </div>
          <div id="trend-chart" class="text-neutral-400"></div>
        </section>
      </main>

      <footer class="flex justify-end pt-4">
        <button id="export-csv" type="button" class="rounded-sm border border-neutral-300 px-3 py-2 text-sm font-medium text-neutral-700 transition-colors hover:border-accent hover:text-accent-ink dark:hover:text-accent focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent dark:border-neutral-700 dark:text-neutral-300">Export CSV</button>
      </footer>
    </div>
  </body>
</html>
